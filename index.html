<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Calendar — Aug–Dec 2026</title>
<style>
  :root{--bg:#f8f7f5;--surface:#ffffff;--border:#e5e2dd;--text:#1a1814;--text-muted:#7a7570;--accent:#7c5cbf;--accent-light:#ede9f7;--today-bg:#fff8e7;--today-border:#f5c842;--radius:10px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;}
  header h1{font-size:1.15rem;font-weight:700;letter-spacing:-0.01em;}
  header>div:first-child span{color:var(--text-muted);font-size:0.83rem;}
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sync-status{display:flex;align-items:center;gap:5px;font-size:0.75rem;color:var(--text-muted);}
  .sync-spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;display:none;flex-shrink:0;}
  .sync-spinner.active{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .loading-overlay.hidden{display:none;}
  .loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  .loading-text{font-size:0.88rem;color:var(--text-muted);font-weight:500;}
  .toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:0.84rem;font-weight:600;max-width:380px;z-index:1000;transform:translateY(80px);opacity:0;transition:all 0.25s ease;pointer-events:none;}
  .toast.visible{transform:none;opacity:1;}
  .toast-error{background:#fee2e2;color:#b91c1c;}
  .toast-success{background:#d1fae5;color:#065f46;}
  .toast-info{background:var(--accent-light);color:var(--accent);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#6b4eaa;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:#f3f1ee;}
  .btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;}
  .btn-danger:hover{background:#fecaca;}
  .filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .filter-label{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:0.76rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
  .chip.active{border-color:currentColor;}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .stats-bar{display:flex;gap:24px;padding:13px 28px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-value{font-size:1.25rem;font-weight:800;letter-spacing:-0.02em;}
  .stat-label{font-size:0.7rem;color:var(--text-muted);font-weight:500;}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .view-btn{padding:6px 12px;font-size:0.78rem;font-weight:600;border:none;background:var(--surface);cursor:pointer;color:var(--text-muted);transition:all 0.15s;}
  .view-btn.active{background:var(--accent);color:#fff;}
  main{padding:22px 28px;max-width:1800px;margin:0 auto;}
  .months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:1200px){.months-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:700px){.months-grid{grid-template-columns:1fr;}}
  .month-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
  .month-header{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .month-header h2{font-size:0.95rem;font-weight:700;}
  .month-header .post-count{font-size:0.75rem;color:var(--text-muted);background:var(--bg);padding:3px 9px;border-radius:20px;}
  .calendar-grid{display:grid;grid-template-columns:repeat(5,1fr);}
  .day-header{padding:7px 4px;text-align:center;font-size:0.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
  .day-header:last-child{border-right:none;}
  .day-cell{min-height:78px;padding:5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;position:relative;}
  .day-cell:hover{background:#f5f4f1;}
  .day-cell:nth-child(5n){border-right:none;}
  .day-cell.empty{background:#fafaf9;cursor:default;}
  .day-cell.today{background:var(--today-bg);}
  .day-cell.today .day-num{background:var(--today-border);color:#1a1814;}
  .day-num{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;font-size:0.73rem;font-weight:600;color:var(--text-muted);margin-bottom:3px;}
  .post-pill{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:4px;font-size:0.66rem;font-weight:600;margin-bottom:2px;cursor:pointer;transition:opacity 0.15s;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .post-pill:hover{opacity:0.72;}
  .post-pill .ch-icon{flex-shrink:0;font-size:0.72rem;}
  .more-posts{font-size:0.63rem;color:var(--text-muted);font-weight:600;padding:1px 3px;cursor:pointer;}
  .list-view{display:none;}
  .list-view.visible{display:block;}
  .list-month{margin-bottom:26px;}
  .list-month-title{font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);}
  .list-post-row{display:grid;grid-template-columns:70px 1fr 120px 160px 100px auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s;}
  .list-post-row:hover{border-color:var(--accent);}
  .list-date{font-size:0.76rem;font-weight:700;color:var(--text-muted);}
  .list-title{font-size:0.84rem;font-weight:600;}
  .list-sub{font-size:0.75rem;color:var(--text-muted);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:modalIn 0.18s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:none;}}
  .modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10;}
  .modal-header h3{font-size:0.98rem;font-weight:700;}
  .modal-close{width:27px;height:27px;border-radius:6px;border:none;background:var(--bg);cursor:pointer;font-size:1rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--border);}
  .modal-body{padding:18px 22px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px;}
  .form-row.full{grid-template-columns:1fr;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group label{font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
  .form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:0.86rem;color:var(--text);font-family:inherit;background:var(--surface);transition:border-color 0.15s;outline:none;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  .form-group textarea{resize:vertical;min-height:68px;}
  .ms-wrap{position:relative;}
  .ms-trigger{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:0.86rem;color:var(--text);font-family:inherit;background:var(--surface);cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:border-color 0.15s;outline:none;}
  .ms-trigger:focus,.ms-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  .ms-trigger-label{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0;}
  .ms-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:var(--accent-light);color:var(--accent);border-radius:4px;font-size:0.73rem;font-weight:600;white-space:nowrap;}
  .ms-tag .rm{cursor:pointer;opacity:0.6;font-size:0.85rem;margin-left:1px;}
  .ms-tag .rm:hover{opacity:1;}
  .ms-placeholder{color:var(--text-muted);font-size:0.86rem;}
  .ms-chevron{color:var(--text-muted);flex-shrink:0;font-size:0.73rem;}
  .ms-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:300;max-height:220px;overflow-y:auto;}
  .ms-dropdown.open{display:block;}
  .ms-option{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;font-size:0.84rem;font-weight:500;transition:background 0.1s;}
  .ms-option:hover{background:var(--bg);}
  .ms-option.selected{background:var(--accent-light);font-weight:700;}
  .ms-option input[type="checkbox"]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;padding:0;border:none;box-shadow:none;}
  .color-picker-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .color-swatch{width:23px;height:23px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.1s;}
  .color-swatch.selected{border-color:var(--text);transform:scale(1.15);}
  .modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--surface);}
  .influencer-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:0.8rem;font-weight:700;}
  .calendar-view{display:block;}
  .calendar-view.hidden{display:none;}
  .no-posts{text-align:center;padding:38px 20px;color:var(--text-muted);font-size:0.84rem;}
  .ch-fields{display:none;}
  .ch-fields.visible{display:block;}
  .ch-section-label{font-size:0.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px;margin-top:2px;padding:4px 0;border-bottom:1px solid var(--accent-light);}
  .evergreen-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .evergreen-row label{font-size:0.83rem;font-weight:600;color:var(--text);cursor:pointer;}
  .evergreen-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:0.68rem;font-weight:700;background:#d1fae5;color:#065f46;}
  .setup-banner{background:#fff8e7;border-bottom:2px solid #f5c842;padding:12px 28px;font-size:0.85rem;display:none;}
  .setup-banner.visible{display:block;}
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading from Google Sheets…</div>
</div>
<div id="toast" class="toast"></div>
<header>
  <div>
    <h1>Marketing Calendar</h1>
    <span>August through December 2026</span>
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <div class="sync-spinner" id="syncSpinner"></div>
      <span id="syncText"></span>
    </div>
    <button class="btn btn-secondary" style="padding:7px 10px;font-size:1rem" onclick="loadPosts()" title="Refresh">↻</button>
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('calendar')">📅 Calendar</button>
      <button class="view-btn" onclick="setView('list')">☰ List</button>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Post</button>
  </div>
</header>
<div id="setupBanner" class="setup-banner"></div>
<div class="stats-bar" id="statsBar"></div>
<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <div class="filter-chips" id="filterChips">
    <div class="chip active" style="color:#7c5cbf;background:#ede9f7" onclick="toggleFilter('all')">
      <span class="dot"></span> All
    </div>
  </div>
</div>
<main>
  <div class="calendar-view" id="calendarView">
    <div class="months-grid" id="monthsGrid"></div>
  </div>
  <div class="list-view" id="listView"></div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Post</h3>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="postDate" min="2026-08-01" max="2026-12-31">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="postStatus">
            <option value="Planned">🗓 Planned</option>
            <option value="Brief Sent">📤 Brief Sent</option>
            <option value="In Review">👀 In Review</option>
            <option value="Approved">✅ Approved</option>
            <option value="In Production">🚀 In Production</option>
            <option value="Live">🟢 Live</option>
            <option value="Complete">🏁 Complete</option>
          </select>
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Channel *</label>
          <select id="postChannel" onchange="onChannelChange(this.value)">
            <option value="">Select a channel…</option>
            <option value="Influencer / Creator">🤝 Influencer / Creator</option>
            <option value="Newsletter">📧 Newsletter</option>
            <option value="Paid Social">💰 Paid Social</option>
            <option value="Programmatic">📊 Programmatic (Progo)</option>
            <option value="Sponsorships">🎙️ Sponsorships</option>
            <option value="Partnerships">🤝 Partnerships</option>
            <option value="DOOH">🏙️ DOOH</option>
            <option value="Paid Search">🔍 Paid Search</option>
            <option value="Customer Story">⭐ Customer Story</option>
          </select>
        </div>
      </div>

      <!-- INFLUENCER / CREATOR fields -->
      <div class="ch-fields" id="fieldsInfluencer">
        <div class="ch-section-label">Influencer / Creator Details</div>
        <div class="form-row full">
          <div class="form-group">
            <label>Platforms</label>
            <div class="ms-wrap" id="platformWrap">
              <button type="button" class="ms-trigger" id="platformTrigger" onclick="toggleDropdown('platform',event)">
                <span class="ms-trigger-label" id="platformLabel"><span class="ms-placeholder">Instagram, TikTok…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="platformDropdown"></div>
            </div>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Post Type</label>
            <div class="ms-wrap" id="typeWrap">
              <button type="button" class="ms-trigger" id="typeTrigger" onclick="toggleDropdown('type',event)">
                <span class="ms-trigger-label" id="typeLabel"><span class="ms-placeholder">Feed Post, Story / Reel…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="typeDropdown"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- PAID SOCIAL fields -->
      <div class="ch-fields" id="fieldsPaidSocial">
        <div class="ch-section-label">Paid Social Details</div>
        <div class="form-row">
          <div class="form-group">
            <label>Platform</label>
            <div class="ms-wrap" id="psSocialPlatformWrap">
              <button type="button" class="ms-trigger" id="psSocialPlatformTrigger" onclick="toggleDropdown('psSocialPlatform',event)">
                <span class="ms-trigger-label" id="psSocialPlatformLabel"><span class="ms-placeholder">LinkedIn, Meta…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="psSocialPlatformDropdown"></div>
            </div>
          </div>
          <div class="form-group">
            <label>Format</label>
            <div class="ms-wrap" id="psFormatWrap">
              <button type="button" class="ms-trigger" id="psFormatTrigger" onclick="toggleDropdown('psFormat',event)">
                <span class="ms-trigger-label" id="psFormatLabel"><span class="ms-placeholder">Video, Static…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="psFormatDropdown"></div>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Funnel Stage</label>
            <select id="psFunnel">
              <option value="">Select…</option>
              <option value="Awareness">Awareness</option>
              <option value="Interest">Interest</option>
              <option value="Consideration">Consideration</option>
            </select>
          </div>
          <div class="form-group">
            <label>Audience</label>
            <div class="ms-wrap" id="psAudienceWrap">
              <button type="button" class="ms-trigger" id="psAudienceTrigger" onclick="toggleDropdown('psAudience',event)">
                <span class="ms-trigger-label" id="psAudienceLabel"><span class="ms-placeholder">Marketer, GenBiz…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="psAudienceDropdown"></div>
            </div>
          </div>
        </div>
        <div class="evergreen-row">
          <input type="checkbox" id="psEvergreen" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer">
          <label for="psEvergreen">Evergreen</label>
        </div>
      </div>

      <!-- PROGRAMMATIC fields -->
      <div class="ch-fields" id="fieldsProgo">
        <div class="ch-section-label">Programmatic Details</div>
        <div class="form-row">
          <div class="form-group">
            <label>Type</label>
            <div class="ms-wrap" id="progoTypeWrap">
              <button type="button" class="ms-trigger" id="progoTypeTrigger" onclick="toggleDropdown('progoType',event)">
                <span class="ms-trigger-label" id="progoTypeLabel"><span class="ms-placeholder">Display, Native…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="progoTypeDropdown"></div>
            </div>
          </div>
          <div class="form-group">
            <label>Funnel Stage</label>
            <select id="progoFunnel">
              <option value="">Select…</option>
              <option value="Awareness">Awareness</option>
              <option value="Interest">Interest</option>
              <option value="Intent">Intent</option>
            </select>
          </div>
        </div>
        <div class="evergreen-row">
          <input type="checkbox" id="progoEvergreen" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer">
          <label for="progoEvergreen">Evergreen</label>
        </div>
      </div>

      <!-- SPONSORSHIPS fields -->
      <div class="ch-fields" id="fieldsSponsorship">
        <div class="ch-section-label">Sponsorship Details</div>
        <div class="form-row full">
          <div class="form-group">
            <label>Type</label>
            <select id="sponsorshipType">
              <option value="">Select…</option>
              <option value="Newsletter">Newsletter</option>
              <option value="Podcasts">Podcasts</option>
            </select>
          </div>
        </div>
      </div>

      <!-- PARTNERSHIPS fields -->
      <div class="ch-fields" id="fieldsPartnership">
        <div class="ch-section-label">Partnership Details</div>
        <div class="form-row full">
          <div class="form-group">
            <label>Type</label>
            <select id="partnershipType">
              <option value="">Select…</option>
              <option value="Influencer">Influencer</option>
              <option value="Creator">Creator</option>
            </select>
          </div>
        </div>
      </div>

      <!-- PAID SEARCH fields -->
      <div class="ch-fields" id="fieldsPaidSearch">
        <div class="ch-section-label">Paid Search Details</div>
        <div class="form-row full">
          <div class="form-group">
            <label>Campaign Type</label>
            <select id="paidSearchType">
              <option value="PMax">PMax</option>
            </select>
          </div>
        </div>
      </div>

      <!-- CUSTOMER STORY fields -->
      <div class="ch-fields" id="fieldsCustomerStory">
        <div class="ch-section-label">Customer Story Details</div>
        <div class="form-row full">
          <div class="form-group">
            <label>Format</label>
            <select id="customerStoryFormat">
              <option value="">Select…</option>
              <option value="Video">Video</option>
              <option value="Static">Static</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Name / Partner (shown for relevant channels) -->
      <div id="nameFieldRow" class="form-row" style="display:none">
        <div class="form-group">
          <label id="nameFieldLabel">Name / Partner *</label>
          <input type="text" id="postInfluencer" placeholder="e.g. @handle or Company" list="influencerSuggestions">
          <datalist id="influencerSuggestions"></datalist>
        </div>
        <div class="form-group" id="colorFieldInName">
          <label>Color Label</label>
          <div class="color-picker-row" id="colorPicker"></div>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Post Title / Topic *</label>
          <input type="text" id="postTitle" placeholder="Brief description">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Notes / Brief</label>
          <textarea id="postNotes" placeholder="Key messaging, hashtags, links, deliverables…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteCurrentPost()" style="display:none">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
        <button class="btn btn-primary" onclick="savePost()">Save Post</button>
      </div>
    </div>
  </div>
</div>

<!-- Day modal -->
<div class="modal-overlay" id="dayModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 id="dayModalTitle">Posts</h3>
      <button class="modal-close" onclick="closeModal('dayModal')">✕</button>
    </div>
    <div class="modal-body" id="dayModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="openAddFromDay()">+ Add Post</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycby-K4snEnkdMp6objKzxp2gmDfDcxVVW4fQYKUHKGaSrsbJzSRFZPursqzqO5-0YA5-/exec';
const COLORS=[
  {hex:'#7c5cbf',name:'Purple'},{hex:'#e85d7a',name:'Rose'},{hex:'#2eaaf0',name:'Blue'},
  {hex:'#1db88e',name:'Teal'},{hex:'#f5a623',name:'Orange'},{hex:'#e05252',name:'Red'},
  {hex:'#5f9b3c',name:'Green'},{hex:'#7b5ea7',name:'Indigo'},{hex:'#e07b3c',name:'Burnt'},{hex:'#3c8fe0',name:'Sky'}
];
const INFLUENCER_COLOR='#2eaaf0'; // default blue for Influencer/Creator
const MONTHS=[
  {name:'August',month:7,year:2026},{name:'September',month:8,year:2026},
  {name:'October',month:9,year:2026},{name:'November',month:10,year:2026},{name:'December',month:11,year:2026}
];
const CHANNEL_ICONS={
  'Influencer / Creator':'🤝','Newsletter':'📧','Paid Social':'💰',
  'Programmatic':'📊','Sponsorships':'🎙️','Partnerships':'🤝',
  'DOOH':'🏙️','Paid Search':'🔍','Customer Story':'⭐'
};
// Channels that show the name/partner field
const CHANNELS_WITH_NAME=['Influencer / Creator','Sponsorships','Partnerships','Customer Story'];
const PLATFORM_ICON={'Instagram':'📸','TikTok':'🎵','YouTube':'▶️','X / Twitter':'🐦','LinkedIn':'💼','Facebook':'👥','Pinterest':'📌','Blog':'✍️','Podcast':'🎤','Email':'📧','Other':'🔗'};
const STATUS_COLORS={'Planned':'#94a3b8','Brief Sent':'#60a5fa','In Review':'#f59e0b','Approved':'#10b981','In Production':'#f97316','Live':'#22c55e','Complete':'#6366f1'};

var MS_SELECTED={
  platform:[],type:[],
  psSocialPlatform:[],psFormat:[],psAudience:[],progoType:[]
};
var MS_CONFIG={
  platform:{items:[{value:'Instagram',icon:'📸'},{value:'TikTok',icon:'🎵'},{value:'YouTube',icon:'▶️'},{value:'X / Twitter',icon:'🐦'},{value:'LinkedIn',icon:'💼'},{value:'Facebook',icon:'👥'},{value:'Pinterest',icon:'📌'},{value:'Blog',icon:'✍️'},{value:'Podcast',icon:'🎤'},{value:'Email',icon:'📧'},{value:'Other',icon:'🔗'}],placeholder:'Instagram, TikTok…'},
  type:{items:[{value:'Feed Post'},{value:'Story / Reel'},{value:'Video'},{value:'Live'},{value:'Newsletter'},{value:'Article'},{value:'Event'},{value:'Collab'},{value:'Takeover'},{value:'Giveaway'}],placeholder:'Feed Post, Story…'},
  psSocialPlatform:{items:[{value:'LinkedIn'},{value:'Meta'}],placeholder:'LinkedIn, Meta…'},
  psFormat:{items:[{value:'Video'},{value:'Static'},{value:'Carousel'},{value:'InMail'},{value:'Takeover'},{value:'Boosted'},{value:'Thought Leader'}],placeholder:'Video, Static…'},
  psAudience:{items:[{value:'Marketer'},{value:'GenBiz'},{value:'SCS'}],placeholder:'Marketer, GenBiz…'},
  progoType:{items:[{value:'Display'},{value:'Native'},{value:'YouTube'},{value:'CTV'}],placeholder:'Display, Native…'}
};

let posts=[],isSyncing=false,lastSynced=null,activeFilters=new Set(['all']),currentEditId=null,selectedColor=COLORS[0].hex,currentView='calendar';
var _dayModalDate='';

function normalizeDate(raw){
  if(!raw)return'';
  var s=String(raw);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var d=new Date(s);
  if(isNaN(d.getTime()))return s;
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}

function migratePost(p){
  var channel=p.channel||'';
  if(!channel&&p.platforms&&(Array.isArray(p.platforms)?p.platforms.length:p.platform))channel='Influencer / Creator';
  return{
    ...p,
    date:normalizeDate(p.date),
    platforms:Array.isArray(p.platforms)?p.platforms:(p.platform?[p.platform]:[]),
    types:Array.isArray(p.types)?p.types:(p.type?[p.type]:[]),
    channel:channel,
    subType:p.subType||'',
    format:p.format||'',
    funnel:p.funnel||'',
    audience:Array.isArray(p.audience)?p.audience:(p.audience?[p.audience]:[]),
    evergreen:p.evergreen===true||p.evergreen==='TRUE'||p.evergreen==='true'
  };
}

async function loadPosts(silent){
  if(!silent)document.getElementById('loadingOverlay').classList.remove('hidden');
  setSyncing(true);
  try{
    const res=await fetch(APPS_SCRIPT_URL);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    posts=(data.posts||[]).map(migratePost);
    lastSynced=new Date();updateSyncStatus();renderAll();return true;
  }catch(err){
    if(!silent)showToast('Could not connect to Google Sheets.','error');return false;
  }finally{
    setSyncing(false);if(!silent)document.getElementById('loadingOverlay').classList.add('hidden');
  }
}
async function pushPost(post){
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'save',post})});
    lastSynced=new Date();updateSyncStatus();return true;
  }catch(err){showToast('Could not sync to Google Sheets.','error');return false;}
}
async function pushDelete(id){
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'delete',id})});
    lastSynced=new Date();updateSyncStatus();
  }catch(err){showToast('Deleted locally but could not sync.','error');}
}
function setSyncing(v){isSyncing=v;document.getElementById('syncSpinner').classList.toggle('active',v);updateSyncStatus();}
function updateSyncStatus(){
  var el=document.getElementById('syncText');
  if(isSyncing){el.textContent='Syncing…';return;}
  if(!lastSynced){el.textContent='';return;}
  var secs=Math.floor((new Date()-lastSynced)/1000);
  if(secs<8)el.textContent='Synced';else if(secs<60)el.textContent='Synced '+secs+'s ago';else el.textContent='Synced '+Math.floor(secs/60)+'m ago';
}
function showToast(msg,type){type=type||'info';var t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type+' visible';setTimeout(function(){t.classList.remove('visible');},4500);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function rgba(hex,alpha){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+alpha+')';}

// ---- Multi-select dropdown system ----
function buildDropdown(key){
  var cfg=MS_CONFIG[key];if(!cfg)return;
  var selected=MS_SELECTED[key]||[],dd=document.getElementById(key+'Dropdown');if(!dd)return;
  dd.innerHTML='';
  cfg.items.forEach(function(item){
    var v=item.value,isSel=selected.indexOf(v)>-1;
    var opt=document.createElement('div');opt.className='ms-option'+(isSel?' selected':'');
    var sv=v.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    opt.innerHTML='<input type="checkbox"'+(isSel?' checked':'')+' onclick="handleMsCheck(event,\''+key+'\',\''+sv+'\')">'+(item.icon?'<span>'+item.icon+'</span>':'')+'<span>'+v+'</span>';
    opt.addEventListener('click',function(e){if(e.target.tagName!=='INPUT')toggleMsOption(key,v);});
    dd.appendChild(opt);
  });
}
function toggleMsOption(key,value){
  if(!MS_SELECTED[key])MS_SELECTED[key]=[];
  var arr=MS_SELECTED[key],idx=arr.indexOf(value);
  if(idx>-1)arr.splice(idx,1);else arr.push(value);
  buildDropdown(key);updateMsLabel(key);
}
function handleMsCheck(e,key,value){e.stopPropagation();toggleMsOption(key,value);}
function toggleDropdown(key,e){
  e.stopPropagation();
  var dd=document.getElementById(key+'Dropdown'),trigger=document.getElementById(key+'Trigger');if(!dd)return;
  var isOpen=dd.classList.contains('open');
  Object.keys(MS_CONFIG).forEach(function(k){
    if(k!==key){var d=document.getElementById(k+'Dropdown'),t=document.getElementById(k+'Trigger');if(d)d.classList.remove('open');if(t)t.classList.remove('open');}
  });
  dd.classList.toggle('open',!isOpen);trigger.classList.toggle('open',!isOpen);
}
function closeDropdown(key){var dd=document.getElementById(key+'Dropdown'),t=document.getElementById(key+'Trigger');if(dd)dd.classList.remove('open');if(t)t.classList.remove('open');}
function updateMsLabel(key){
  var cfg=MS_CONFIG[key];if(!cfg)return;
  var selected=MS_SELECTED[key]||[],label=document.getElementById(key+'Label');if(!label)return;
  if(selected.length===0){label.innerHTML='<span class="ms-placeholder">'+cfg.placeholder+'</span>';}
  else{label.innerHTML=selected.map(function(v){var sv=v.replace(/\\/g,'\\\\').replace(/'/g,"\\'");return'<span class="ms-tag">'+v+'<span class="rm" onclick="removeMsTag(event,\''+key+'\',\''+sv+'\')">x</span></span>';}).join('');}
}
function removeMsTag(e,key,value){e.stopPropagation();toggleMsOption(key,value);}
document.addEventListener('click',function(e){
  Object.keys(MS_CONFIG).forEach(function(key){
    var wrap=document.getElementById(key+'Wrap');
    if(wrap&&!wrap.contains(e.target))closeDropdown(key);
  });
});
function resetAllDropdowns(){
  Object.keys(MS_SELECTED).forEach(function(k){MS_SELECTED[k]=[];buildDropdown(k);updateMsLabel(k);});
}

// ---- Channel change ----
function onChannelChange(channel){
  var allFields=['fieldsInfluencer','fieldsPaidSocial','fieldsProgo','fieldsSponsorship','fieldsPartnership','fieldsPaidSearch','fieldsCustomerStory'];
  allFields.forEach(function(id){var el=document.getElementById(id);if(el)el.classList.remove('visible');});
  var map={
    'Influencer / Creator':'fieldsInfluencer',
    'Paid Social':'fieldsPaidSocial',
    'Programmatic':'fieldsProgo',
    'Sponsorships':'fieldsSponsorship',
    'Partnerships':'fieldsPartnership',
    'Paid Search':'fieldsPaidSearch',
    'Customer Story':'fieldsCustomerStory'
  };
  if(map[channel])document.getElementById(map[channel]).classList.add('visible');
  // Show/hide name row
  var nameRow=document.getElementById('nameFieldRow');
  nameRow.style.display=CHANNELS_WITH_NAME.indexOf(channel)>-1?'':'none';
  // Auto-set blue for Influencer/Creator if creating new post
  if(channel==='Influencer / Creator'&&!currentEditId){
    selectedColor=INFLUENCER_COLOR;
    renderColorPicker(selectedColor);
  }
}

// ---- Stats / filter ----
function getFilteredPosts(){
  if(activeFilters.has('all'))return posts;
  return posts.filter(function(p){return activeFilters.has(p.channel);});
}
function toggleFilter(val){
  if(val==='all'){activeFilters=new Set(['all']);}
  else{activeFilters.delete('all');if(activeFilters.has(val)){activeFilters.delete(val);if(activeFilters.size===0)activeFilters.add('all');}else{activeFilters.add(val);}}
  renderAll();
}

function renderStats(){
  var f=getFilteredPosts();
  var live=f.filter(function(p){return p.status==='Live'||p.status==='Complete';}).length;
  function cnt(ch){return f.filter(function(p){return p.channel===ch;}).length;}
  document.getElementById('statsBar').innerHTML=
    stat(f.length,'Total Posts')+
    stat(live,'Live / Complete')+
    stat(cnt('Influencer / Creator'),'Influencer / Creator')+
    stat(cnt('Paid Social'),'Paid Social')+
    stat(cnt('Programmatic'),'Programmatic')+
    stat(cnt('Sponsorships'),'Sponsorships')+
    stat(cnt('Newsletter'),'Newsletter')+
    stat(cnt('Customer Story'),'Customer Story');
}
function stat(v,l){return'<div class="stat"><div class="stat-value">'+v+'</div><div class="stat-label">'+l+'</div></div>';}

function renderFilterChips(){
  var chips=document.getElementById('filterChips');chips.innerHTML='';
  // All chip
  var allChip=document.createElement('div');allChip.className='chip'+(activeFilters.has('all')?' active':'');
  allChip.style.cssText='color:#7c5cbf;background:#ede9f7';
  allChip.innerHTML='<span class="dot"></span> All';allChip.onclick=function(){toggleFilter('all');};chips.appendChild(allChip);
  // One chip per channel that has posts
  var channelColors={
    'Influencer / Creator':'#2eaaf0','Newsletter':'#f5a623','Paid Social':'#7c5cbf',
    'Programmatic':'#1db88e','Sponsorships':'#e85d7a','Partnerships':'#3c8fe0',
    'DOOH':'#e07b3c','Paid Search':'#e05252','Customer Story':'#5f9b3c'
  };
  var seen={};posts.forEach(function(p){if(p.channel&&!seen[p.channel])seen[p.channel]=true;});
  Object.keys(seen).sort().forEach(function(ch){
    var color=channelColors[ch]||'#7c5cbf';
    var chip=document.createElement('div');chip.className='chip'+(activeFilters.has(ch)?' active':'');
    chip.style.cssText='color:'+color+';background:'+rgba(color,0.1);
    chip.innerHTML='<span class="dot"></span>'+(CHANNEL_ICONS[ch]||'')+' '+ch;
    chip.onclick=function(){toggleFilter(ch);};chips.appendChild(chip);
  });
}

function renderAll(){renderStats();renderFilterChips();renderCalendar();renderListView();updateInfluencerSuggestions();}

function getPostIcon(post){
  if(post.channel==='Influencer / Creator'&&post.platforms&&post.platforms.length){
    return post.platforms.slice(0,2).map(function(v){return PLATFORM_ICON[v]||'🔗';}).join('');
  }
  return CHANNEL_ICONS[post.channel]||'📌';
}
function getPostLabel(post){
  return post.influencer||post.channel||post.title;
}
function getPostColor(post){
  if(post.channel==='Influencer / Creator')return post.color||INFLUENCER_COLOR;
  return post.color||COLORS[0].hex;
}

function renderCalendar(){
  var grid=document.getElementById('monthsGrid');grid.innerHTML='';var filtered=getFilteredPosts();
  MONTHS.forEach(function(mo){
    var mp=filtered.filter(function(p){var d=new Date(p.date+'T00:00:00');return d.getMonth()===mo.month&&d.getFullYear()===mo.year;});
    var card=document.createElement('div');card.className='month-card';
    card.innerHTML='<div class="month-header"><h2>'+mo.name+' '+mo.year+'</h2><span class="post-count">'+mp.length+' post'+(mp.length!==1?'s':'')+'</span></div>';
    var cal=document.createElement('div');cal.className='calendar-grid';
    ['Mon','Tue','Wed','Thu','Fri'].forEach(function(d){var dh=document.createElement('div');dh.className='day-header';dh.textContent=d;cal.appendChild(dh);});
    var firstDow=new Date(mo.year,mo.month,1).getDay();
    var firstOffset=(firstDow===0)?4:(firstDow-1);
    for(var i=0;i<firstOffset;i++){var b=document.createElement('div');b.className='day-cell empty';cal.appendChild(b);}
    var today=new Date(),days=new Date(mo.year,mo.month+1,0).getDate();
    for(var d=1;d<=days;d++){(function(day){
      var dow=new Date(mo.year,mo.month,day).getDay();
      if(dow===0||dow===6)return;
      var cell=document.createElement('div');cell.className='day-cell';
      if(today.getFullYear()===mo.year&&today.getMonth()===mo.month&&today.getDate()===day)cell.classList.add('today');
      var pad=function(n){return String(n).padStart(2,'0');};
      var dateStr=mo.year+'-'+pad(mo.month+1)+'-'+pad(day);
      var dayPosts=mp.filter(function(p){return p.date===dateStr;});
      var num=document.createElement('div');num.className='day-num';num.textContent=day;cell.appendChild(num);
      dayPosts.slice(0,3).forEach(function(post){
        var color=getPostColor(post);
        var pill=document.createElement('div');pill.className='post-pill';
        pill.style.cssText='background:'+rgba(color,0.15)+';color:'+color;
        pill.title=getPostLabel(post)+' — '+post.title;
        pill.innerHTML='<span class="ch-icon">'+getPostIcon(post)+'</span><span style="overflow:hidden;text-overflow:ellipsis">'+getPostLabel(post)+'</span>';
        pill.onclick=function(e){e.stopPropagation();openEditModal(post.id);};
        cell.appendChild(pill);
      });
      if(dayPosts.length>3){
        var more=document.createElement('div');more.className='more-posts';
        more.textContent='+'+(dayPosts.length-3)+' more';
        more.onclick=function(e){e.stopPropagation();openDayModal(dateStr,dayPosts);};
        cell.appendChild(more);
      }
      cell.onclick=function(){openAddModal(dateStr);};cal.appendChild(cell);
    })(d);}
    card.appendChild(cal);grid.appendChild(card);
  });
}

function renderListView(){
  var container=document.getElementById('listView');container.innerHTML='';var filtered=getFilteredPosts();
  if(filtered.length===0){container.innerHTML='<div class="no-posts">No posts yet. Click "+ Add Post" to get started.</div>';return;}
  MONTHS.forEach(function(mo){
    var mp=filtered.filter(function(p){var d=new Date(p.date+'T00:00:00');return d.getMonth()===mo.month&&d.getFullYear()===mo.year;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    if(!mp.length)return;
    var sec=document.createElement('div');sec.className='list-month';
    sec.innerHTML='<div class="list-month-title">'+mo.name+' '+mo.year+' — '+mp.length+' post'+(mp.length!==1?'s':'')+'</div>';
    mp.forEach(function(post){
      var d=new Date(post.date+'T00:00:00');
      var color=getPostColor(post);
      var channelBadge='<span style="font-size:0.72rem;font-weight:700;background:'+rgba(color,0.13)+';color:'+color+';padding:2px 8px;border-radius:4px;white-space:nowrap">'+(CHANNEL_ICONS[post.channel]||'📌')+' '+(post.channel||'—')+'</span>';
      var subInfo=[];
      if(post.subType)subInfo.push(post.subType);
      if(post.format)subInfo.push(post.format);
      if(post.funnel)subInfo.push(post.funnel);
      if(post.channel==='Influencer / Creator'&&post.types&&post.types.length)subInfo.push(post.types.join(', '));
      var nameBadge=post.influencer?'<span class="influencer-badge" style="background:'+rgba(color,0.13)+';color:'+color+'">'+post.influencer+'</span>':'—';
      var row=document.createElement('div');row.className='list-post-row';
      row.innerHTML='<div class="list-date">'+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</div>'+
        '<div><div class="list-title">'+post.title+'</div><div class="list-sub">'+(subInfo.join(' · ')||'')+'</div></div>'+
        '<div>'+channelBadge+'</div><div>'+nameBadge+'</div>'+
        '<div>'+(post.evergreen?'<span class="evergreen-badge">🌿 Evergreen</span>':'')+'</div>'+
        '<div><span style="font-size:0.7rem;font-weight:700;color:'+(STATUS_COLORS[post.status]||'#94a3b8')+'">'+(post.status||'Planned')+'</span></div>';
      row.onclick=function(){openEditModal(post.id);};sec.appendChild(row);
    });
    container.appendChild(sec);
  });
}

function updateInfluencerSuggestions(){
  var dl=document.getElementById('influencerSuggestions'),seen={},names=[];
  posts.forEach(function(p){if(p.influencer&&!seen[p.influencer]){seen[p.influencer]=true;names.push(p.influencer);}});
  names.sort();dl.innerHTML=names.map(function(n){return'<option value="'+n+'">';}).join('');
}

function renderColorPicker(sel){
  var cp=document.getElementById('colorPicker');if(!cp)return;cp.innerHTML='';
  COLORS.forEach(function(c){
    var sw=document.createElement('div');sw.className='color-swatch'+(c.hex===sel?' selected':'');
    sw.style.background=c.hex;sw.title=c.name;
    sw.onclick=function(){selectedColor=c.hex;document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected');});sw.classList.add('selected');};
    cp.appendChild(sw);
  });
}

// ---- Day modal ----
function openDayModal(dateStr,dayPosts){
  _dayModalDate=dateStr;
  var d=new Date(dateStr+'T00:00:00');
  document.getElementById('dayModalTitle').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var body=document.getElementById('dayModalBody');body.innerHTML='';
  dayPosts.forEach(function(post){
    var color=getPostColor(post);
    var row=document.createElement('div');
    row.style.cssText='padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:flex-start';
    row.innerHTML='<div style="width:8px;height:8px;border-radius:50%;background:'+color+';margin-top:5px;flex-shrink:0"></div>'+
      '<div style="flex:1"><div style="font-size:0.86rem;font-weight:600">'+post.title+'</div>'+
      '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">'+(CHANNEL_ICONS[post.channel]||'📌')+' '+(post.channel||'')+(post.influencer?' · '+post.influencer:'')+(post.subType?' · '+post.subType:'')+'</div>'+
      (post.notes?'<div style="font-size:0.75rem;color:var(--text-muted);margin-top:3px">'+post.notes.slice(0,80)+(post.notes.length>80?'…':'')+'</div>':'')+'</div>'+
      '<span style="font-size:0.7rem;font-weight:700;color:'+(STATUS_COLORS[post.status]||'#94a3b8')+'">'+(post.status||'Planned')+'</span>';
    row.onclick=function(){closeModal('dayModal');openEditModal(post.id);};
    body.appendChild(row);
  });
  document.getElementById('dayModal').classList.add('open');
}
function openAddFromDay(){closeModal('dayModal');openAddModal(_dayModalDate);}

// ---- Add / Edit modal ----
function openAddModal(dateStr){
  currentEditId=null;
  document.getElementById('modalTitle').textContent='Add Post';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('postDate').value=dateStr||'';
  document.getElementById('postInfluencer').value='';
  document.getElementById('postTitle').value='';
  document.getElementById('postNotes').value='';
  document.getElementById('postStatus').value='Planned';
  document.getElementById('postChannel').value='';
  onChannelChange('');
  resetAllDropdowns();
  ['psFunnel','progoFunnel','sponsorshipType','partnershipType','customerStoryFormat'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('paidSearchType').value='PMax';
  document.getElementById('psEvergreen').checked=false;
  document.getElementById('progoEvergreen').checked=false;
  selectedColor=COLORS[0].hex;
  renderColorPicker(selectedColor);
  document.getElementById('addModal').classList.add('open');
}

function openEditModal(id){
  var post=null;
  for(var i=0;i<posts.length;i++){if(posts[i].id===id){post=posts[i];break;}}if(!post)return;
  currentEditId=id;
  document.getElementById('modalTitle').textContent='Edit Post';
  document.getElementById('deleteBtn').style.display='inline-flex';
  document.getElementById('postDate').value=post.date;
  document.getElementById('postInfluencer').value=post.influencer||'';
  document.getElementById('postTitle').value=post.title;
  document.getElementById('postNotes').value=post.notes||'';
  document.getElementById('postStatus').value=post.status||'Planned';
  selectedColor=post.color||COLORS[0].hex;
  resetAllDropdowns();
  var channel=post.channel||'';
  document.getElementById('postChannel').value=channel;
  onChannelChange(channel);
  if(channel==='Influencer / Creator'){
    post.platforms.forEach(function(v){if(v&&MS_SELECTED.platform.indexOf(v)<0)MS_SELECTED.platform.push(v);});
    post.types.forEach(function(v){if(v&&MS_SELECTED.type.indexOf(v)<0)MS_SELECTED.type.push(v);});
    buildDropdown('platform');updateMsLabel('platform');
    buildDropdown('type');updateMsLabel('type');
  } else if(channel==='Paid Social'){
    if(post.subType)post.subType.split(', ').forEach(function(v){if(v&&MS_SELECTED.psSocialPlatform.indexOf(v)<0)MS_SELECTED.psSocialPlatform.push(v);});
    if(post.format)post.format.split(', ').forEach(function(v){if(v&&MS_SELECTED.psFormat.indexOf(v)<0)MS_SELECTED.psFormat.push(v);});
    if(post.audience)post.audience.forEach(function(v){if(v&&MS_SELECTED.psAudience.indexOf(v)<0)MS_SELECTED.psAudience.push(v);});
    buildDropdown('psSocialPlatform');updateMsLabel('psSocialPlatform');
    buildDropdown('psFormat');updateMsLabel('psFormat');
    buildDropdown('psAudience');updateMsLabel('psAudience');
    document.getElementById('psFunnel').value=post.funnel||'';
    document.getElementById('psEvergreen').checked=post.evergreen||false;
  } else if(channel==='Programmatic'){
    if(post.subType)post.subType.split(', ').forEach(function(v){if(v&&MS_SELECTED.progoType.indexOf(v)<0)MS_SELECTED.progoType.push(v);});
    buildDropdown('progoType');updateMsLabel('progoType');
    document.getElementById('progoFunnel').value=post.funnel||'';
    document.getElementById('progoEvergreen').checked=post.evergreen||false;
  } else if(channel==='Sponsorships'){
    document.getElementById('sponsorshipType').value=post.subType||'';
  } else if(channel==='Partnerships'){
    document.getElementById('partnershipType').value=post.subType||'';
  } else if(channel==='Paid Search'){
    document.getElementById('paidSearchType').value=post.subType||'PMax';
  } else if(channel==='Customer Story'){
    document.getElementById('customerStoryFormat').value=post.format||'';
  }
  renderColorPicker(selectedColor);
  document.getElementById('addModal').classList.add('open');
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  Object.keys(MS_CONFIG).forEach(function(key){closeDropdown(key);});
}

async function savePost(){
  var date=document.getElementById('postDate').value;
  var title=document.getElementById('postTitle').value.trim();
  var channel=document.getElementById('postChannel').value;
  var notes=document.getElementById('postNotes').value.trim();
  var status=document.getElementById('postStatus').value;
  if(!date||!title||!channel){alert('Please fill in Date, Channel, and Post Title.');return;}
  var influencer=document.getElementById('postInfluencer').value.trim();
  if(CHANNELS_WITH_NAME.indexOf(channel)>-1&&!influencer){alert('Please fill in the Name / Partner field.');return;}
  var platforms=[],types=[],subType='',format='',funnel='',audience=[],evergreen=false;
  if(channel==='Influencer / Creator'){
    platforms=MS_SELECTED.platform.slice();
    types=MS_SELECTED.type.slice();
  } else if(channel==='Paid Social'){
    subType=MS_SELECTED.psSocialPlatform.join(', ');
    format=MS_SELECTED.psFormat.join(', ');
    funnel=document.getElementById('psFunnel').value;
    audience=MS_SELECTED.psAudience.slice();
    evergreen=document.getElementById('psEvergreen').checked;
    platforms=[channel];
  } else if(channel==='Programmatic'){
    subType=MS_SELECTED.progoType.join(', ');
    funnel=document.getElementById('progoFunnel').value;
    evergreen=document.getElementById('progoEvergreen').checked;
    platforms=[channel];
  } else if(channel==='Sponsorships'){
    subType=document.getElementById('sponsorshipType').value;platforms=[channel];
  } else if(channel==='Partnerships'){
    subType=document.getElementById('partnershipType').value;platforms=[channel];
  } else if(channel==='Paid Search'){
    subType=document.getElementById('paidSearchType').value;platforms=[channel];
  } else if(channel==='Customer Story'){
    format=document.getElementById('customerStoryFormat').value;platforms=[channel];
  } else {
    platforms=[channel];
  }
  // Use blue as default for Influencer/Creator, otherwise keep selectedColor
  var defaultColor=channel==='Influencer / Creator'?INFLUENCER_COLOR:COLORS[0].hex;
  // Use the color the user explicitly picked; only auto-fill on new posts if name already exists
  var color=selectedColor;
  if(!currentEditId&&influencer){var existingByName=posts.find(function(p){return p.influencer===influencer&&p.channel===channel;});if(existingByName&&selectedColor===COLORS[0].hex&&selectedColor!==INFLUENCER_COLOR)color=existingByName.color;}
  var id=currentEditId||uid();
  var postObj={id:id,date:date,influencer:influencer,title:title,platforms:platforms,types:types,notes:notes,status:status,color:color,channel:channel,subType:subType,format:format,funnel:funnel,audience:audience,evergreen:evergreen};
  if(currentEditId){var idx=posts.findIndex(function(p){return p.id===currentEditId;});if(idx>=0)posts[idx]=postObj;else posts.push(postObj);}
  else{posts.push(postObj);}
  closeModal('addModal');renderAll();
  setSyncing(true);
  var saved=await pushPost(postObj);
  if(saved){
    var ok=await loadPosts(true);
    if(ok&&!posts.find(function(p){return p.id===postObj.id;})){posts.push(postObj);renderAll();showToast('Saved but not yet confirmed in Sheets.','info');}
  }
  setSyncing(false);
}

async function deleteCurrentPost(){
  if(!currentEditId)return;if(!confirm('Delete this post?'))return;
  var id=currentEditId;posts=posts.filter(function(p){return p.id!==id;});closeModal('addModal');renderAll();
  setSyncing(true);await pushDelete(id);await loadPosts(true);setSyncing(false);
}

function setView(v){
  currentView=v;
  document.getElementById('calendarView').classList.toggle('hidden',v!=='calendar');
  document.getElementById('listView').classList.toggle('visible',v==='list');
  document.querySelectorAll('.view-btn').forEach(function(btn,i){btn.classList.toggle('active',(i===0&&v==='calendar')||(i===1&&v==='list'));});
}

document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeModal('addModal');});
document.getElementById('dayModal').addEventListener('click',function(e){if(e.target===this)closeModal('dayModal');});

Object.keys(MS_CONFIG).forEach(function(key){buildDropdown(key);updateMsLabel(key);});
renderColorPicker(COLORS[0].hex);
setInterval(updateSyncStatus,10000);
setInterval(function(){loadPosts(true);},30000);
loadPosts();
</script>
