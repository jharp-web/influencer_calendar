<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Calendar 2026</title>
<style>
  :root{
    --bg:#f8f7f5;--surface:#ffffff;--border:#e5e2dd;--text:#1a1814;--text-muted:#7a7570;
    --accent:#7c5cbf;--accent-light:#ede9f7;--today-bg:#fff8e7;--today-border:#f5c842;--radius:10px;
    --paid:#7c5cbf;--organic:#1db88e;--lcm:#f5a623;--brand:#e85d7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;flex-shrink:0;}
  header h1{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em;}
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sync-status{display:flex;align-items:center;gap:5px;font-size:0.74rem;color:var(--text-muted);min-width:70px;}
  .sync-spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;display:none;flex-shrink:0;}
  .sync-spinner.active{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .loading-overlay.hidden{display:none;}
  .loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  .loading-text{font-size:0.88rem;color:var(--text-muted);font-weight:500;}
  .toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:0.84rem;font-weight:600;max-width:380px;z-index:1000;transform:translateY(80px);opacity:0;transition:all 0.25s ease;pointer-events:none;}
  .toast.visible{transform:none;opacity:1;}
  .toast-error{background:#fee2e2;color:#b91c1c;}
  .toast-success{background:#d1fae5;color:#065f46;}
  .toast-info{background:var(--accent-light);color:var(--accent);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#6b4eaa;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:#f3f1ee;}
  .btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;}
  .btn-danger:hover{background:#fecaca;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  /* ---- Month navigation ---- */
  .month-nav{display:flex;align-items:center;gap:10px;}
  .nav-arrow{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:1.05rem;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
  .nav-arrow:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent);}
  .nav-arrow:disabled{opacity:0.3;cursor:not-allowed;}
  .month-title{font-size:1.15rem;font-weight:800;letter-spacing:-0.02em;min-width:190px;text-align:center;}
  .month-title .yr{color:var(--text-muted);font-weight:600;margin-left:5px;}
  .month-count{font-size:0.74rem;color:var(--text-muted);background:var(--bg);padding:3px 10px;border-radius:20px;white-space:nowrap;}

  .filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
  .filter-label{font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:0.78rem;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all 0.15s;user-select:none;}
  .chip.active{border-color:currentColor;}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}

  /* ---- Calendar ---- */
  main{flex:1;min-height:0;padding:14px 24px 18px;display:flex;flex-direction:column;}
  .month-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0;}
  .calendar-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto;flex:1;min-height:0;}
  .day-header{padding:8px 6px;text-align:center;font-size:0.7rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:#fcfbfa;}
  .day-header:nth-child(5){border-right:none;}
  .day-cell{padding:5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;position:relative;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;}
  .day-cell::-webkit-scrollbar{width:5px;}
  .day-cell::-webkit-scrollbar-thumb{background:#d8d4ce;border-radius:3px;}
  .day-cell:hover{background:#f5f4f1;}
  .day-cell:nth-child(5n){border-right:none;}
  .day-cell.empty{background:#fafaf9;cursor:default;}
  .day-cell.today{background:var(--today-bg);}
  .day-cell.today .day-num{background:var(--today-border);color:#1a1814;}
  .day-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:0.75rem;font-weight:700;color:var(--text-muted);margin-bottom:3px;flex-shrink:0;}

  .post-pill{display:flex;align-items:flex-start;gap:4px;padding:3px 7px;border-radius:4px;font-size:0.71rem;font-weight:600;margin-bottom:3px;cursor:pointer;transition:opacity 0.15s;max-width:100%;word-break:break-word;white-space:normal;line-height:1.3;flex-shrink:0;}
  .post-pill:hover{opacity:0.72;}
  .post-pill .ch-icon{flex-shrink:0;font-size:0.72rem;}
  .post-pill .pill-label{min-width:0;}

  /* Multi-day span bars — identical width/height on every day so the bar
     reads as one continuous pill. -6px margins cancel the cell padding. */
  .post-pill.span-left,.post-pill.span-mid,.post-pill.span-right,.post-pill.span-solo{
    height:19px;min-height:19px;max-height:19px;
    margin-left:-6px;margin-right:-6px;margin-bottom:3px;
    width:calc(100% + 12px);max-width:none;
    padding:0 7px;
    align-items:center;overflow:hidden;white-space:nowrap;
    position:relative;z-index:5;
    border-radius:0;
  }
  .post-pill.span-left{border-radius:4px 0 0 4px;}
  .post-pill.span-right{border-radius:0 4px 4px 0;}
  .post-pill.span-solo{border-radius:4px;}
  .post-pill.span-left .pill-label,.post-pill.span-solo .pill-label{overflow:hidden;text-overflow:ellipsis;}
  .post-pill.span-cont .ch-icon,.post-pill.span-cont .pill-label{display:none;}
  .post-pill.span-cont{padding:0;}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:modalIn 0.18s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:none;}}
  .modal-header{padding:17px 22px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10;}
  .modal-header h3{font-size:0.98rem;font-weight:700;}
  .modal-close{width:27px;height:27px;border-radius:6px;border:none;background:var(--bg);cursor:pointer;font-size:1rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--border);}
  .modal-body{padding:18px 22px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px;}
  .form-row.full{grid-template-columns:1fr;}
  .form-row.thirds{grid-template-columns:1fr 1fr 1fr;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group label{font-size:0.71rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
  .form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:0.86rem;color:var(--text);font-family:inherit;background:var(--surface);transition:border-color 0.15s;outline:none;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  .form-group textarea{resize:vertical;min-height:66px;}

  .team-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .team-btn{padding:10px 6px;border-radius:8px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:0.84rem;font-weight:700;transition:all 0.15s;color:var(--text-muted);}
  .team-btn:hover{border-color:currentColor;}
  .team-btn.selected{color:#fff;}

  .ms-wrap{position:relative;}
  .ms-trigger{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:0.86rem;color:var(--text);font-family:inherit;background:var(--surface);cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:border-color 0.15s;outline:none;}
  .ms-trigger:focus,.ms-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  .ms-trigger-label{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0;}
  .ms-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:var(--accent-light);color:var(--accent);border-radius:4px;font-size:0.73rem;font-weight:600;white-space:nowrap;}
  .ms-tag .rm{cursor:pointer;opacity:0.6;font-size:0.85rem;margin-left:1px;}
  .ms-tag .rm:hover{opacity:1;}
  .ms-placeholder{color:var(--text-muted);font-size:0.86rem;}
  .ms-chevron{color:var(--text-muted);flex-shrink:0;font-size:0.73rem;}
  .ms-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:300;max-height:220px;overflow-y:auto;}
  .ms-dropdown.open{display:block;}
  .ms-option{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;font-size:0.84rem;font-weight:500;transition:background 0.1s;}
  .ms-option:hover{background:var(--bg);}
  .ms-option.selected{background:var(--accent-light);font-weight:700;}
  .ms-option input[type="checkbox"]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;padding:0;border:none;box-shadow:none;flex-shrink:0;}

  .modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--surface);}
  .cond-fields{display:none;}
  .cond-fields.visible{display:block;}
  .no-team-msg{font-size:0.83rem;color:var(--text-muted);padding:10px 0 4px;}
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading from Google Sheets…</div>
</div>
<div id="toast" class="toast"></div>

<header>
  <div class="month-nav">
    <button class="nav-arrow" id="prevBtn" onclick="changeMonth(-1)" title="Previous month">‹</button>
    <div class="month-title" id="monthTitle">—</div>
    <button class="nav-arrow" id="nextBtn" onclick="changeMonth(1)" title="Next month">›</button>
    <span class="month-count" id="monthCount"></span>
    <button class="btn btn-secondary" style="padding:6px 11px;font-size:0.78rem" onclick="goToday()">Today</button>
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <div class="sync-spinner" id="syncSpinner"></div>
      <span id="syncText"></span>
    </div>
    <button class="btn btn-secondary" style="padding:7px 10px;font-size:1rem" onclick="loadPosts()" title="Refresh">↻</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Post</button>
  </div>
</header>

<div class="filter-bar">
  <span class="filter-label">Teams</span>
  <div class="filter-chips" id="filterChips"></div>
</div>

<main>
  <div class="month-card">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Post</h3>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">

      <div class="form-group" style="margin-bottom:8px">
        <label>Team *</label>
      </div>
      <div class="team-picker" id="teamPicker"></div>

      <div class="form-row thirds">
        <div class="form-group">
          <label>Start Date *</label>
          <input type="date" id="postDate" min="2026-01-01" max="2026-12-31" onchange="onStartDateChange()">
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input type="date" id="postEndDate" min="2026-01-01" max="2026-12-31">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="postStatus">
            <option value="Planned">🗓 Planned</option>
            <option value="Brief Sent">📤 Brief Sent</option>
            <option value="In Review">👀 In Review</option>
            <option value="Approved">✅ Approved</option>
            <option value="In Production">🚀 In Production</option>
            <option value="Live">🟢 Live</option>
            <option value="Cancelled">🚫 Cancelled</option>
          </select>
        </div>
      </div>

      <!-- Channel (Paid + Organic) -->
      <div class="cond-fields" id="channelFields">
        <div class="form-row full">
          <div class="form-group">
            <label>Channel *</label>
            <select id="postChannel" autocomplete="off" onchange="onChannelChange()"></select>
          </div>
        </div>
      </div>

      <!-- Platform (Paid only) -->
      <div class="cond-fields" id="platformFields">
        <div class="form-row full">
          <div class="form-group">
            <label>Platform</label>
            <div class="ms-wrap" id="platformWrap">
              <button type="button" class="ms-trigger" id="platformTrigger" onclick="toggleDropdown('platform',event)">
                <span class="ms-trigger-label" id="platformLabel"><span class="ms-placeholder">Select platforms…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="platformDropdown"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Post Type (Paid + Organic) -->
      <div class="cond-fields" id="postTypeFields">
        <div class="form-row full">
          <div class="form-group">
            <label>Post Type</label>
            <div class="ms-wrap" id="postTypeWrap">
              <button type="button" class="ms-trigger" id="postTypeTrigger" onclick="toggleDropdown('postType',event)">
                <span class="ms-trigger-label" id="postTypeLabel"><span class="ms-placeholder">Select post types…</span></span>
                <span class="ms-chevron">▾</span>
              </button>
              <div class="ms-dropdown" id="postTypeDropdown"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Name / Partner</label>
          <input type="text" id="postInfluencer" placeholder="e.g. @handle, exec name, or vendor" list="nameSuggestions" autocomplete="off">
          <datalist id="nameSuggestions"></datalist>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Title / Topic *</label>
          <input type="text" id="postTitle" placeholder="Brief description">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Notes / Brief</label>
          <textarea id="postNotes" placeholder="Key messaging, links, deliverables…"></textarea>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteCurrentPost()" style="display:none">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
        <button class="btn btn-primary" id="saveBtn" onclick="savePost()">Save Post</button>
      </div>
    </div>
  </div>
</div>

<!-- Day modal -->
<div class="modal-overlay" id="dayModal">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <h3 id="dayModalTitle">Posts</h3>
      <button class="modal-close" onclick="closeModal('dayModal')">✕</button>
    </div>
    <div class="modal-body" id="dayModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" style="margin-left:auto" onclick="openAddFromDay()">+ Add Post</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycby-K4snEnkdMp6objKzxp2gmDfDcxVVW4fQYKUHKGaSrsbJzSRFZPursqzqO5-0YA5-/exec';
const YEAR=2026;

const TEAMS=['Paid','Organic','LCM','Brand'];
const TEAM_COLORS={'Paid':'#7c5cbf','Organic':'#1db88e','LCM':'#f5a623','Brand':'#e85d7a'};
const TEAM_ICONS={'Paid':'💰','Organic':'🌱','LCM':'📧','Brand':'✨'};

const MONTH_NAMES=['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];

// ---- Channel + platform + post-type option sets ----
const PAID_CHANNELS=['Paid Social','Paid Search','Programmatic','Direct Buy','DOOH',
                     'Sponsorships','Partnerships','Influencer / Creator','Newsletter','Customer Story'];
const ORGANIC_CHANNELS=['LinkedIn','Reddit','Facebook','X','TikTok','YouTube','Instagram','Threads'];

// Platform options keyed by paid channel; '_default' is the fallback
const PAID_PLATFORMS={
  'Paid Social':['LinkedIn','Meta','Reddit','LinkedIn CTV','TikTok','X','Instagram'],
  'Paid Search':['PMax','SA360','Demand Gen','AI Max'],
  'Programmatic':['Display','Native','YouTube','CTV','Audio','Apple News','Inflight'],
  'Direct Buy':['Direct Buy','Influencers','Affiliates'],
  'DOOH':['OOH','DOOH','Inflight'],
  'Sponsorships':['Newsletter','Podcast','Event'],
  'Partnerships':['Influencers','Affiliates','Co-marketing'],
  'Influencer / Creator':['Instagram','TikTok','YouTube','LinkedIn','X'],
  'Newsletter':['Email'],
  'Customer Story':['Web','Video','Social'],
  '_default':['LinkedIn','Meta','Reddit','Display','Native','YouTube','CTV','PMax','SA360','OOH','DOOH','Audio','Apple News','Direct Buy']
};

const ORGANIC_POST_TYPES=['Carousel','Static Image','Text','Video (horizontal)','Video (vertical)',
                          'Album','Poll','Story / Reel','Live'];
const PAID_POST_TYPES=['Static','Video/Animation','Carousel','Copy','Free Form','OOH','Direct Buy'];

const STATUS_COLORS={'Planned':'#94a3b8','Brief Sent':'#60a5fa','In Review':'#f59e0b',
                     'Approved':'#10b981','In Production':'#f97316','Live':'#059669','Cancelled':'#dc2626'};

// ---- State ----
let posts=[];
let isSyncing=false,lastSynced=null;
let activeTeams=new Set(TEAMS);
let currentEditId=null;
let currentMonth=new Date().getFullYear()===YEAR?new Date().getMonth():0;
let selectedTeam='';
var _dayModalDate='';

var MS_SELECTED={platform:[],postType:[]};
var MS_CONFIG={
  platform:{items:[],placeholder:'Select platforms…'},
  postType:{items:[],placeholder:'Select post types…'}
};

// =====================================================================
// Helpers
// =====================================================================
function pad2(n){return String(n).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function rgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function normalizeDate(raw){
  if(!raw)return'';
  var s=String(raw);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var d=new Date(s);
  if(isNaN(d.getTime()))return'';
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}

function normalizeTeam(t,channel){
  var v=String(t||'').trim();
  for(var i=0;i<TEAMS.length;i++){if(TEAMS[i].toLowerCase()===v.toLowerCase())return TEAMS[i];}
  var c=String(channel||'').toLowerCase();
  if(/newsletter|email|lifecycle/.test(c))return'LCM';
  if(/customer story|case study/.test(c))return'Brand';
  if(/linkedin|reddit|facebook|instagram|tiktok|youtube|threads|^x$|twitter/.test(c))return'Organic';
  return'Paid';
}

function migratePost(p){
  var channel=p.channel||'';
  return{
    id:p.id,
    team:normalizeTeam(p.team,channel),
    date:normalizeDate(p.date),
    endDate:normalizeDate(p.endDate)||'',
    channel:channel,
    platforms:Array.isArray(p.platforms)?p.platforms:(p.platforms?[p.platforms]:[]),
    postType:p.postType||p.subType||'',
    influencer:p.influencer||'',
    title:p.title||'',
    notes:p.notes||'',
    status:p.status||'Planned',
    funnel:p.funnel||'',
    format:p.format||'',
    audience:Array.isArray(p.audience)?p.audience:(p.audience?[p.audience]:[]),
    evergreen:p.evergreen===true||p.evergreen==='TRUE'||p.evergreen==='true',
    source:p.source||''
  };
}

function formatDateShort(dateStr){
  if(!dateStr)return'';
  var d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function getPostColor(post){return TEAM_COLORS[post.team]||'#7a7570';}

function getPostLabel(post){
  if(post.influencer&&post.team==='Organic')return post.influencer+' · '+(post.title||post.channel);
  return post.title||post.channel||post.team;
}

function getPostIcon(post){
  return TEAM_ICONS[post.team]||'📌';
}

// =====================================================================
// Data
// =====================================================================
async function loadPosts(silent){
  if(!silent)document.getElementById('loadingOverlay').classList.remove('hidden');
  setSyncing(true);
  try{
    const res=await fetch(APPS_SCRIPT_URL);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    posts=(data.posts||[]).map(migratePost).filter(function(p){return p.id&&p.date;});
    lastSynced=new Date();updateSyncStatus();renderAll();return true;
  }catch(err){
    if(!silent)showToast('Could not connect to Google Sheets.','error');
    return false;
  }finally{
    setSyncing(false);
    if(!silent)document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

async function pushPost(post){
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      redirect:'follow',body:JSON.stringify({action:'save',post:post})});
    lastSynced=new Date();updateSyncStatus();return true;
  }catch(err){showToast('Could not sync to Google Sheets.','error');return false;}
}

async function pushDelete(id){
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      redirect:'follow',body:JSON.stringify({action:'delete',id:id})});
    lastSynced=new Date();updateSyncStatus();
  }catch(err){showToast('Deleted locally but could not sync.','error');}
}

function setSyncing(v){isSyncing=v;document.getElementById('syncSpinner').classList.toggle('active',v);updateSyncStatus();}
function updateSyncStatus(){
  var el=document.getElementById('syncText');
  if(isSyncing){el.textContent='Syncing…';return;}
  if(!lastSynced){el.textContent='';return;}
  var secs=Math.floor((new Date()-lastSynced)/1000);
  if(secs<8)el.textContent='Synced';
  else if(secs<60)el.textContent='Synced '+secs+'s ago';
  else el.textContent='Synced '+Math.floor(secs/60)+'m ago';
}
function showToast(msg,type){
  type=type||'info';var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast toast-'+type+' visible';
  setTimeout(function(){t.classList.remove('visible');},4200);
}

// =====================================================================
// Multi-select dropdowns
// =====================================================================
function buildDropdown(key){
  var cfg=MS_CONFIG[key];if(!cfg)return;
  var selected=MS_SELECTED[key]||[],dd=document.getElementById(key+'Dropdown');if(!dd)return;
  dd.innerHTML='';
  cfg.items.forEach(function(v){
    var isSel=selected.indexOf(v)>-1;
    var opt=document.createElement('div');
    opt.className='ms-option'+(isSel?' selected':'');
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=isSel;
    cb.onclick=function(e){e.stopPropagation();toggleMsOption(key,v);};
    var sp=document.createElement('span');sp.textContent=v;
    opt.appendChild(cb);opt.appendChild(sp);
    opt.addEventListener('click',function(e){if(e.target.tagName!=='INPUT')toggleMsOption(key,v);});
    dd.appendChild(opt);
  });
}
function toggleMsOption(key,value){
  if(!MS_SELECTED[key])MS_SELECTED[key]=[];
  var arr=MS_SELECTED[key],i=arr.indexOf(value);
  if(i>-1)arr.splice(i,1);else arr.push(value);
  buildDropdown(key);updateMsLabel(key);
}
function toggleDropdown(key,e){
  e.stopPropagation();
  var dd=document.getElementById(key+'Dropdown'),tr=document.getElementById(key+'Trigger');
  if(!dd)return;
  var isOpen=dd.classList.contains('open');
  Object.keys(MS_CONFIG).forEach(function(k){
    if(k!==key){
      var d=document.getElementById(k+'Dropdown'),t=document.getElementById(k+'Trigger');
      if(d)d.classList.remove('open');if(t)t.classList.remove('open');
    }
  });
  dd.classList.toggle('open',!isOpen);tr.classList.toggle('open',!isOpen);
}
function closeDropdown(key){
  var dd=document.getElementById(key+'Dropdown'),t=document.getElementById(key+'Trigger');
  if(dd)dd.classList.remove('open');if(t)t.classList.remove('open');
}
function updateMsLabel(key){
  var cfg=MS_CONFIG[key];if(!cfg)return;
  var selected=MS_SELECTED[key]||[],label=document.getElementById(key+'Label');if(!label)return;
  if(!selected.length){
    label.innerHTML='<span class="ms-placeholder">'+esc(cfg.placeholder)+'</span>';return;
  }
  label.innerHTML='';
  selected.forEach(function(v){
    var tag=document.createElement('span');tag.className='ms-tag';tag.textContent=v;
    var rm=document.createElement('span');rm.className='rm';rm.textContent='×';
    rm.onclick=function(e){e.stopPropagation();toggleMsOption(key,v);};
    tag.appendChild(rm);label.appendChild(tag);
  });
}
document.addEventListener('click',function(e){
  Object.keys(MS_CONFIG).forEach(function(key){
    var wrap=document.getElementById(key+'Wrap');
    if(wrap&&!wrap.contains(e.target))closeDropdown(key);
  });
});

// =====================================================================
// Team / channel cascade
// =====================================================================
function renderTeamPicker(){
  var box=document.getElementById('teamPicker');box.innerHTML='';
  TEAMS.forEach(function(t){
    var b=document.createElement('button');
    b.type='button';b.className='team-btn'+(selectedTeam===t?' selected':'');
    b.textContent=TEAM_ICONS[t]+' '+t;
    b.style.color=selectedTeam===t?'#fff':TEAM_COLORS[t];
    b.style.background=selectedTeam===t?TEAM_COLORS[t]:'var(--surface)';
    b.style.borderColor=TEAM_COLORS[t];
    b.onclick=function(){selectTeam(t);};
    box.appendChild(b);
  });
}

function selectTeam(t,keepValues){
  selectedTeam=t;
  renderTeamPicker();
  var chWrap=document.getElementById('channelFields');
  var ptWrap=document.getElementById('postTypeFields');
  var pfWrap=document.getElementById('platformFields');
  var sel=document.getElementById('postChannel');

  if(t==='Paid'||t==='Organic'){
    var opts=t==='Paid'?PAID_CHANNELS:ORGANIC_CHANNELS;
    var prev=keepValues?sel.value:'';
    sel.innerHTML='<option value="">Select a channel…</option>'+
      opts.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
    if(prev&&opts.indexOf(prev)>-1)sel.value=prev;
    chWrap.classList.add('visible');
    ptWrap.classList.add('visible');
    MS_CONFIG.postType.items=(t==='Paid'?PAID_POST_TYPES:ORGANIC_POST_TYPES).slice();
    if(!keepValues)MS_SELECTED.postType=[];
    buildDropdown('postType');updateMsLabel('postType');
  }else{
    chWrap.classList.remove('visible');
    ptWrap.classList.remove('visible');
    sel.innerHTML='<option value="">—</option>';
    MS_SELECTED.postType=[];
  }

  // Platform is Paid-only, and its options depend on the channel
  if(t==='Paid'){
    pfWrap.classList.add('visible');
    onChannelChange(keepValues);
  }else{
    pfWrap.classList.remove('visible');
    MS_SELECTED.platform=[];
    MS_CONFIG.platform.items=[];
    buildDropdown('platform');updateMsLabel('platform');
  }
}

function onChannelChange(keepValues){
  if(selectedTeam!=='Paid')return;
  var ch=document.getElementById('postChannel').value;
  MS_CONFIG.platform.items=(PAID_PLATFORMS[ch]||PAID_PLATFORMS._default).slice();
  if(!keepValues){
    MS_SELECTED.platform=[];
  }else{
    // keep only still-valid selections
    MS_SELECTED.platform=MS_SELECTED.platform.filter(function(v){
      return MS_CONFIG.platform.items.indexOf(v)>-1;
    });
  }
  buildDropdown('platform');updateMsLabel('platform');
}

function onStartDateChange(){
  var sd=document.getElementById('postDate').value;
  var ed=document.getElementById('postEndDate');
  if(sd){ed.min=sd;if(ed.value&&ed.value<sd)ed.value=sd;}
}

// =====================================================================
// Filters
// =====================================================================
function getFilteredPosts(){
  return posts.filter(function(p){return activeTeams.has(p.team);});
}
function toggleTeamFilter(t){
  if(activeTeams.has(t)){
    activeTeams.delete(t);
    if(activeTeams.size===0)TEAMS.forEach(function(x){activeTeams.add(x);});
  }else{
    activeTeams.add(t);
  }
  renderAll();
}
function renderFilterChips(){
  var box=document.getElementById('filterChips');box.innerHTML='';
  TEAMS.forEach(function(t){
    var color=TEAM_COLORS[t];
    var chip=document.createElement('div');
    chip.className='chip'+(activeTeams.has(t)?' active':'');
    chip.style.color=color;
    chip.style.background=activeTeams.has(t)?rgba(color,0.12):'transparent';
    chip.style.opacity=activeTeams.has(t)?'1':'0.45';
    chip.innerHTML='<span class="dot"></span>'+TEAM_ICONS[t]+' '+t;
    chip.onclick=function(){toggleTeamFilter(t);};
    box.appendChild(chip);
  });
}

// =====================================================================
// Calendar — single month, fills the screen
// =====================================================================
function changeMonth(delta){
  var n=currentMonth+delta;
  if(n<0||n>11)return;
  currentMonth=n;renderAll();
}
function goToday(){
  var t=new Date();
  currentMonth=t.getFullYear()===YEAR?t.getMonth():0;
  renderAll();
}

function renderCalendar(){
  var grid=document.getElementById('calendarGrid');
  grid.innerHTML='';
  var filtered=getFilteredPosts();
  var mo=currentMonth;

  document.getElementById('monthTitle').innerHTML=MONTH_NAMES[mo]+'<span class="yr">'+YEAR+'</span>';
  document.getElementById('prevBtn').disabled=(mo===0);
  document.getElementById('nextBtn').disabled=(mo===11);

  var mStart=YEAR+'-'+pad2(mo+1)+'-01';
  var daysInMonth=new Date(YEAR,mo+1,0).getDate();
  var mEnd=YEAR+'-'+pad2(mo+1)+'-'+pad2(daysInMonth);

  // Posts overlapping this month
  var mp=filtered.filter(function(p){
    var ed=p.endDate||p.date;
    return p.date<=mEnd&&ed>=mStart;
  });
  var startCount=mp.filter(function(p){
    return p.date>=mStart&&p.date<=mEnd;
  }).length;
  document.getElementById('monthCount').textContent=
    startCount+' post'+(startCount!==1?'s':'');

  // Day headers
  ['Mon','Tue','Wed','Thu','Fri'].forEach(function(d){
    var dh=document.createElement('div');dh.className='day-header';dh.textContent=d;
    grid.appendChild(dh);
  });

  // Leading blanks: Mon=1..Fri=5 -> offset dow-1; weekend start -> 0
  var firstDow=new Date(YEAR,mo,1).getDay();
  var firstOffset=(firstDow>=1&&firstDow<=5)?firstDow-1:0;
  for(var i=0;i<firstOffset;i++){
    var b=document.createElement('div');b.className='day-cell empty';grid.appendChild(b);
  }

  var today=new Date();
  var weekdayCount=firstOffset;

  for(var day=1;day<=daysInMonth;day++){
    var dow=new Date(YEAR,mo,day).getDay();
    if(dow===0||dow===6)continue;
    weekdayCount++;
    grid.appendChild(buildDayCell(day,dow,mo,mp,today));
  }

  // Trailing blanks so the last row is complete
  var rem=weekdayCount%5;
  if(rem!==0){
    for(var j=rem;j<5;j++){
      var e=document.createElement('div');e.className='day-cell empty';grid.appendChild(e);
    }
  }

  // Size rows evenly to fill available height
  var rows=Math.ceil(weekdayCount/5);
  grid.style.gridTemplateRows='auto repeat('+rows+',minmax(0,1fr))';
}

function buildDayCell(day,dow,mo,mp,today){
  var cell=document.createElement('div');cell.className='day-cell';
  var dateStr=YEAR+'-'+pad2(mo+1)+'-'+pad2(day);
  if(today.getFullYear()===YEAR&&today.getMonth()===mo&&today.getDate()===day)
    cell.classList.add('today');

  // Spanning posts first so their bars line up across the week
  var dayPosts=mp.filter(function(p){
    var ed=p.endDate||p.date;
    return p.date<=dateStr&&ed>=dateStr;
  }).sort(function(a,b){
    var aS=a.endDate&&a.endDate>a.date?1:0;
    var bS=b.endDate&&b.endDate>b.date?1:0;
    if(aS!==bS)return bS-aS;
    return (a.team+a.title).localeCompare(b.team+b.title);
  });

  var num=document.createElement('div');num.className='day-num';num.textContent=day;
  cell.appendChild(num);

  dayPosts.forEach(function(post){
    var color=getPostColor(post);
    var hasSpan=post.endDate&&post.endDate>post.date;
    var pill=document.createElement('div');
    pill.className='post-pill';
    pill.style.background=rgba(color,hasSpan?0.26:0.14);
    pill.style.color=color;

    if(hasSpan){
      var isStart=post.date===dateStr;
      var isEnd=post.endDate===dateStr;
      var isMon=dow===1,isFri=dow===5;
      var visStart=isStart||(isMon&&!isStart);
      var visEnd=isEnd||(isFri&&!isEnd);
      if(visStart&&visEnd)pill.classList.add('span-solo');
      else if(visStart)pill.classList.add('span-left');
      else if(visEnd)pill.classList.add('span-right');
      else pill.classList.add('span-mid');
      if(!visStart)pill.classList.add('span-cont');
    }

    pill.title=getPostLabel(post)+
      (hasSpan?' ('+formatDateShort(post.date)+' – '+formatDateShort(post.endDate)+')':'')+
      (post.channel?'\n'+post.channel:'')+
      (post.status?'\n'+post.status:'');

    var ic=document.createElement('span');ic.className='ch-icon';ic.textContent=getPostIcon(post);
    var lb=document.createElement('span');lb.className='pill-label';lb.textContent=getPostLabel(post);
    pill.appendChild(ic);pill.appendChild(lb);
    pill.onclick=function(e){e.stopPropagation();openEditModal(post.id);};
    cell.appendChild(pill);
  });

  cell.onclick=function(){
    if(dayPosts.length>1)openDayModal(dateStr,dayPosts);
    else openAddModal(dateStr);
  };
  return cell;
}

function updateNameSuggestions(){
  var dl=document.getElementById('nameSuggestions'),seen={},names=[];
  posts.forEach(function(p){
    if(p.influencer&&!seen[p.influencer]){seen[p.influencer]=true;names.push(p.influencer);}
  });
  names.sort();
  dl.innerHTML='';
  names.forEach(function(n){
    var o=document.createElement('option');o.value=n;dl.appendChild(o);
  });
}

function renderAll(){renderFilterChips();renderCalendar();updateNameSuggestions();}

// =====================================================================
// Day modal
// =====================================================================
function openDayModal(dateStr,dayPosts){
  _dayModalDate=dateStr;
  var d=new Date(dateStr+'T00:00:00');
  document.getElementById('dayModalTitle').textContent=
    d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var body=document.getElementById('dayModalBody');body.innerHTML='';
  dayPosts.forEach(function(post){
    var color=getPostColor(post);
    var row=document.createElement('div');
    row.style.cssText='padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:flex-start';
    var meta=[post.team,post.channel,post.postType,post.influencer].filter(Boolean).join(' · ');
    row.innerHTML=
      '<div style="width:8px;height:8px;border-radius:50%;background:'+color+';margin-top:6px;flex-shrink:0"></div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:0.86rem;font-weight:600">'+esc(post.title)+'</div>'+
        '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">'+esc(meta)+'</div>'+
        (post.notes?'<div style="font-size:0.74rem;color:var(--text-muted);margin-top:3px">'+
          esc(post.notes.slice(0,110))+(post.notes.length>110?'…':'')+'</div>':'')+
      '</div>'+
      '<span style="font-size:0.7rem;font-weight:700;flex-shrink:0;color:'+
        (STATUS_COLORS[post.status]||'#94a3b8')+'">'+esc(post.status||'Planned')+'</span>';
    row.onclick=function(){closeModal('dayModal');openEditModal(post.id);};
    body.appendChild(row);
  });
  document.getElementById('dayModal').classList.add('open');
}
function openAddFromDay(){closeModal('dayModal');openAddModal(_dayModalDate);}

// =====================================================================
// Add / Edit modal
// =====================================================================
function openAddModal(dateStr){
  currentEditId=null;
  document.getElementById('modalTitle').textContent='Add Post';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('postDate').value=dateStr||'';
  document.getElementById('postEndDate').value='';
  document.getElementById('postInfluencer').value='';
  document.getElementById('postTitle').value='';
  document.getElementById('postNotes').value='';
  document.getElementById('postStatus').value='Planned';
  MS_SELECTED.platform=[];MS_SELECTED.postType=[];
  selectedTeam='';
  renderTeamPicker();
  selectTeam('');
  onStartDateChange();
  document.getElementById('addModal').classList.add('open');
}

function openEditModal(id){
  var post=null;
  for(var i=0;i<posts.length;i++){if(posts[i].id===id){post=posts[i];break;}}
  if(!post)return;
  currentEditId=id;
  document.getElementById('modalTitle').textContent='Edit Post';
  document.getElementById('deleteBtn').style.display='inline-flex';
  document.getElementById('postDate').value=post.date;
  document.getElementById('postEndDate').value=post.endDate||'';
  document.getElementById('postInfluencer').value=post.influencer||'';
  document.getElementById('postTitle').value=post.title||'';
  document.getElementById('postNotes').value=post.notes||'';
  document.getElementById('postStatus').value=post.status||'Planned';

  // Seed multi-selects before the cascade so keepValues can preserve them
  MS_SELECTED.platform=post.platforms.slice();
  MS_SELECTED.postType=post.postType?String(post.postType).split(/\s*,\s*/).filter(Boolean):[];

  selectTeam(post.team,true);
  var sel=document.getElementById('postChannel');
  if(post.channel){
    if(!Array.prototype.some.call(sel.options,function(o){return o.value===post.channel;})){
      var o=document.createElement('option');o.value=post.channel;o.textContent=post.channel;
      sel.appendChild(o);
    }
    sel.value=post.channel;
  }
  if(post.team==='Paid')onChannelChange(true);

  // Add any stored values that aren't in the standard option lists
  ['platform','postType'].forEach(function(k){
    MS_SELECTED[k].forEach(function(v){
      if(MS_CONFIG[k].items.indexOf(v)<0)MS_CONFIG[k].items.push(v);
    });
    buildDropdown(k);updateMsLabel(k);
  });

  onStartDateChange();
  document.getElementById('addModal').classList.add('open');
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  Object.keys(MS_CONFIG).forEach(closeDropdown);
}

async function savePost(){
  var date=document.getElementById('postDate').value;
  var endDate=document.getElementById('postEndDate').value||'';
  var title=document.getElementById('postTitle').value.trim();
  var notes=document.getElementById('postNotes').value.trim();
  var status=document.getElementById('postStatus').value;
  var influencer=document.getElementById('postInfluencer').value.trim();
  var channel=document.getElementById('postChannel').value;

  if(!selectedTeam){showToast('Please pick a team.','error');return;}
  if(!date||!title){showToast('Please fill in Start Date and Title / Topic.','error');return;}
  if(endDate&&endDate<date){showToast('End Date must be on or after Start Date.','error');return;}
  if((selectedTeam==='Paid'||selectedTeam==='Organic')&&!channel){
    showToast('Please pick a channel.','error');return;
  }

  var id=currentEditId||uid();
  var postObj={
    id:id,
    team:selectedTeam,
    date:date,
    endDate:endDate,
    channel:(selectedTeam==='Paid'||selectedTeam==='Organic')?channel:'',
    platforms:selectedTeam==='Paid'?MS_SELECTED.platform.slice():
              (selectedTeam==='Organic'&&channel?[channel]:[]),
    postType:MS_SELECTED.postType.join(', '),
    influencer:influencer,
    title:title,
    notes:notes,
    status:status,
    funnel:'',format:'',audience:[],evergreen:false,
    source:''
  };

  // Preserve fields we don't expose in the form
  if(currentEditId){
    var prev=posts.find(function(p){return p.id===currentEditId;});
    if(prev){
      postObj.funnel=prev.funnel;postObj.format=prev.format;
      postObj.audience=prev.audience;postObj.evergreen=prev.evergreen;
      postObj.source=prev.source;
    }
  }

  var idx=posts.findIndex(function(p){return p.id===id;});
  if(idx>=0)posts[idx]=postObj;else posts.push(postObj);
  closeModal('addModal');renderAll();

  setSyncing(true);
  var ok=await pushPost(postObj);
  if(ok)await loadPosts(true);
  setSyncing(false);
}

async function deleteCurrentPost(){
  if(!currentEditId)return;
  if(!confirm('Delete this post?'))return;
  var id=currentEditId;
  posts=posts.filter(function(p){return p.id!==id;});
  closeModal('addModal');renderAll();
  setSyncing(true);await pushDelete(id);await loadPosts(true);setSyncing(false);
}

// =====================================================================
// Init
// =====================================================================
document.getElementById('addModal').addEventListener('click',function(e){
  if(e.target===this)closeModal('addModal');
});
document.getElementById('dayModal').addEventListener('click',function(e){
  if(e.target===this)closeModal('dayModal');
});
document.addEventListener('keydown',function(e){
  if(document.getElementById('addModal').classList.contains('open')||
     document.getElementById('dayModal').classList.contains('open')){
    if(e.key==='Escape'){closeModal('addModal');closeModal('dayModal');}
    return;
  }
  if(e.key==='ArrowLeft')changeMonth(-1);
  if(e.key==='ArrowRight')changeMonth(1);
});

renderTeamPicker();
Object.keys(MS_CONFIG).forEach(function(k){buildDropdown(k);updateMsLabel(k);});
setInterval(updateSyncStatus,10000);
setInterval(function(){loadPosts(true);},60000);
loadPosts();
