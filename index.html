<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Calendar 2026 — Redirecting</title>
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/surveymonkey.com/s/AKfycbweIsI-7YhyZ_SG3_9DlUR7aap3Jz9mEiCXSQhVq5-ZAs0ZNpePfdNbkD8Um-27d3x_/exec">
<style>
  :root{--bg:#f8f7f5;--surface:#fff;--border:#e5e2dd;--text:#1a1814;--muted:#7a7570;--accent:#7c5cbf;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
        padding:34px 36px;max-width:520px;text-align:center;
        box-shadow:0 10px 40px rgba(0,0,0,0.05);}
  h1{font-size:1.15rem;font-weight:700;margin-bottom:10px;}
  p{font-size:0.9rem;color:var(--muted);line-height:1.6;margin-bottom:20px;}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
        padding:11px 20px;border-radius:8px;font-size:0.88rem;font-weight:600;}
  a.btn:hover{background:#6b4eaa;}
  .url{font-family:ui-monospace,Menlo,monospace;font-size:0.7rem;color:var(--muted);
       word-break:break-all;margin-top:18px;line-height:1.5;}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);
           border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>The Marketing Calendar has moved</h1>
    <p>It now runs inside Google so it can use your SurveyMonkey sign-in.
       You should be redirected automatically.</p>
    <a class="btn" id="go" href="https://script.google.com/a/macros/surveymonkey.com/s/AKfycbweIsI-7YhyZ_SG3_9DlUR7aap3Jz9mEiCXSQhVq5-ZAs0ZNpePfdNbkD8Um-27d3x_/exec">Open the calendar</a>
    <p class="url" id="u"></p>
  </div>
<script>
  var TARGET=document.getElementById('go').href;
  document.getElementById('u').textContent=TARGET;
  // Bookmark-friendly: replace history so Back doesn't bounce here again
  setTimeout(function(){ location.replace(TARGET); }, 400);
</script>
</body>
</html>
